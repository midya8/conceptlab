[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptlab"
version = "0.2.0"
description = "Exact finite formal concepts, canonical implications and full closure witnesses"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
conceptlab = "conceptlab.__main__:main"

[tool.setuptools]
packages = ["conceptlab"]
